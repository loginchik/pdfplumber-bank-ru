[project]
name = "pdfplumber-bank-ru"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0,<4.0.0",
    "pdfplumber>=0.11.10,<1.0.0",
]

[dependency-groups]
lint = [
    "ruff>=0.16.5",
]
test = [
    "pytest>=9.1.1",
]


[tool.ruff]
line-length = 127
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
